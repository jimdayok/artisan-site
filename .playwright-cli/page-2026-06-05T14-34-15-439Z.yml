      - paragraph [ref=e1193]: Patient Vision Resources
      - heading "See Better. Feel Better. Choose Independent." [level=1] [ref=e1194]
      - paragraph [ref=e1195]: Premium lenses and independent doctors working together to give you clearer, more comfortable vision.
      - link "Find a Doctor Near You" [ref=e1196] [cursor=pointer]:
        - /url: "#find-a-practice"
    - generic [ref=e1198]:
      - generic [ref=e1199]:
        - paragraph [ref=e1200]: Everyday Friction
        - heading "Struggling With Your Vision?" [level=2] [ref=e1201]
        - paragraph [ref=e1203]: Clear vision should feel easy. If your glasses make normal moments harder, the answer may be better lens design, materials, or coatings.
      - generic [ref=e1204]:
        - generic [ref=e1205]:
          - img [ref=e1207]
          - heading "Tired of glare while driving at night?" [level=3] [ref=e1208]
          - paragraph [ref=e1209]: Light scatter can make headlights feel sharp, hazy, and distracting.
        - generic [ref=e1210]:
          - img [ref=e1212]
          - heading "Eye strain from screens all day?" [level=3] [ref=e1213]
          - paragraph [ref=e1214]: Modern work asks your eyes to shift focus for hours at a time.
        - generic [ref=e1215]:
          - img [ref=e1217]
          - heading "Thick, heavy glasses that don't look right?" [level=3] [ref=e1218]
          - paragraph [ref=e1219]: The right lens material can change both comfort and appearance.
    - generic [ref=e1221]:
      - img "A warm independent eye care setting with eyewear on display" [ref=e1223]
      - generic [ref=e1225]:
        - paragraph [ref=e1226]: The Better Path
        - heading "A Better Way to See" [level=2] [ref=e1227]
        - generic [ref=e1228]:
          - paragraph [ref=e1229]: Independent eye doctors have the freedom to recommend what's best for you, not what they are required to use. That means better lenses, better materials, and solutions designed for your life.
          - paragraph [ref=e1230]: "The experience should feel personal: a doctor listening closely, an optician helping you choose confidently, and a lab crafting your lenses with care."
    - generic [ref=e1232]:
      - generic [ref=e1233]:
        - paragraph [ref=e1234]: Choice Matters
        - heading "Why Independent Eye Care Feels Different" [level=2] [ref=e1235]
        - paragraph [ref=e1237]: The difference is not just where you buy glasses. It is who gets to decide what belongs in front of your eyes.
