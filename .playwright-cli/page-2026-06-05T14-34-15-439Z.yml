        - paragraph [ref=e1268]: Tokai Feature
        - heading "Thinner. Lighter. Better Looking Lenses" [level=2] [ref=e1269]
        - paragraph [ref=e1270]: Advanced materials like ultra-thin high-index lenses reduce thickness, weight, and improve how your glasses look and feel--especially for stronger prescriptions.
      - generic [ref=e1272]:
